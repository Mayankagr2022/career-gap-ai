name: CI and Deploy

# Pull requests and pushes to main run the checks. A push to main that passes them is also deployed to a server
# running Docker Compose (see deploy/README.md for the one-time server setup), after approval of the "production"
# environment. The AWS ECS alternative lives in deploy-aws.yml and only runs when started by hand.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; never cancel one that is already running. New pull request pushes replace older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  check:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the shared package and generate the Prisma client
        run: |
          pnpm --filter @career-gap-ai/shared build
          pnpm --filter @career-gap-ai/api db:generate

      - name: Type-check API and web
        run: |
          pnpm --filter @career-gap-ai/api exec tsc --noEmit -p tsconfig.json
          pnpm --filter @career-gap-ai/web exec tsc --noEmit

      - name: API unit tests
        run: pnpm --filter @career-gap-ai/api test -- --ci

      - name: Production build
        run: pnpm build

  images:
    name: Build Docker images
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://app.example.com/api/v1
            NEXT_PUBLIC_APP_URL=https://app.example.com
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Build images and deploy to the server
    needs: [check]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Add required reviewers to this environment in the repository settings to gate production deploys.
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    permissions:
      contents: read
      packages: write # push the images to the GitHub Container Registry
    env:
      IMAGE_TAG: ${{ github.sha }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/careergap' }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the repository is configured for deploys
        run: |
          missing=""
          for name in PUBLIC_URL SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            eval "value=\${VAR_$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Set these in Settings > Secrets and variables > Actions (PUBLIC_URL is a variable, the others are secrets):$missing"
            exit 1
          fi
        env:
          VAR_PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          VAR_SSH_HOST: ${{ secrets.SSH_HOST }}
          VAR_SSH_USER: ${{ secrets.SSH_USER }}
          VAR_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VAR_SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

      # Registry paths must be lower case; the repository name may not be
      - name: Work out the image names
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/api:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # NEXT_PUBLIC_* values are compiled into the browser bundle, so they are build arguments
      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_URL }}/api/v1
            NEXT_PUBLIC_APP_URL=${{ vars.PUBLIC_URL }}
          tags: ${{ env.IMAGE_PREFIX }}/web:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

      # The compose file, Caddyfile and scripts are versioned with the code and copied on every deploy.
      # The server's .env (secrets) is never touched.
      - name: Copy the deployment files
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -P "$SSH_PORT" \
            deploy/docker-compose.yml deploy/Caddyfile deploy/deploy.sh deploy/backup.sh \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}

      # The registry token goes over stdin so it never appears in a command line or the server's process list
      - name: Deploy
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -p "$SSH_PORT" \
            "${SSH_USER}@${SSH_HOST}" \
            "cd '${DEPLOY_PATH}' && chmod +x deploy.sh backup.sh && REGISTRY_USER='${ACTOR}' IMAGE_PREFIX='${IMAGE_PREFIX}' IMAGE_TAG='${IMAGE_TAG}' ./deploy.sh"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
