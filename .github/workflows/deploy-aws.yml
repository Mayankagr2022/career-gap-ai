name: Deploy to AWS (optional)

# The AWS ECS Fargate alternative to the single-server deployment in main.yml. It is not used by default:
# it only runs when started by hand ("Run workflow"), and it validates the CDK code on pull requests that change infra/.
# One-time AWS setup and the repository variables it needs are described in infra/README.md.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-aws.yml'
      - '.github/scripts/deploy-ecs.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  infra:
    name: Validate infrastructure code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      # Synthesizes the CloudFormation template with placeholder values; --strict fails on warnings
      - name: Synthesize
        run: >
          npx cdk synth --strict --quiet
          -c publicUrl=https://app.example.com
          -c certificateArn=arn:aws:acm:us-east-1:123456789012:certificate/00000000-0000-0000-0000-000000000000

  deploy:
    name: Build images, migrate and deploy to ECS
    needs: [infra]
    # Skipped (not failed) until the AWS role variable exists; this path is optional and the default deploy is main.yml
    if: github.event_name == 'workflow_dispatch' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Add required reviewers to this environment in the repository settings to gate production deploys.
    # The AWS role trusts only jobs that run in this environment.
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    permissions:
      id-token: write # request the OIDC token for AWS
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CLUSTER: careergap
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the repository is configured for AWS deploys
        run: |
          missing=""
          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN PUBLIC_URL; do
            eval "value=\${VAR_$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Set these repository variables (Settings > Secrets and variables > Actions > Variables):$missing"
            exit 1
          fi
        env:
          VAR_AWS_REGION: ${{ vars.AWS_REGION }}
          VAR_AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          VAR_PUBLIC_URL: ${{ vars.PUBLIC_URL }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: Build and push the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/careergap/api:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=aws-api
          cache-to: type=gha,scope=aws-api,mode=max

      # NEXT_PUBLIC_* values are compiled into the browser bundle, so they are build arguments
      - name: Build and push the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_URL }}/api/v1
            NEXT_PUBLIC_APP_URL=${{ vars.PUBLIC_URL }}
          tags: ${{ steps.ecr.outputs.registry }}/careergap/web:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=aws-web
          cache-to: type=gha,scope=aws-web,mode=max

      - name: Migrate the database and roll out the new version
        run: bash .github/scripts/deploy-ecs.sh
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          API_DESIRED_COUNT: ${{ vars.API_DESIRED_COUNT }}
          WEB_DESIRED_COUNT: ${{ vars.WEB_DESIRED_COUNT }}
